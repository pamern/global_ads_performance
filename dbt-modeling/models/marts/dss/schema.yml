version: 2
models:
  - name: dss_monthly
    description: >-
      DSS POC input, one Platform x Month for 2024 (36 expected states).
      Platform names follow the POC; Month is the first calendar day.
      Measures are summed across all source rows; rates are ratios of sums.
      Zero spend yields NULL rates and fails the DSS readiness validity test.
    columns:
      - name: Platform
        quote: true
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Google', 'Meta', 'TikTok']
      - name: Month
        quote: true
        data_tests: [not_null]
      - name: AdSpend
        quote: true
        data_tests: [not_null]
      - name: Revenue
        quote: true
        data_tests: [not_null]
      - name: Impressions
        quote: true
        data_tests: [not_null]
      - name: Conversions
        quote: true
        data_tests: [not_null]
      - name: RevenuePerDollar
        quote: true
        data_tests: [not_null]
      - name: ImpressionsPerDollar
        quote: true
        data_tests: [not_null]
      - name: ConversionsPerDollar
        quote: true
        data_tests: [not_null]
unit_tests:
  - name: dss_monthly_ratio_of_sums
    description: Unequal spend verifies pooled ratios; zero spend yields NULL; dates/platforms outside scope are excluded.
    model: dss_monthly
    given:
      - input: ref('int_ads_performance')
        rows:
          - {date: '2024-01-01', platform: 'Google Ads', ad_spend: 2, revenue: 10, impressions: 20, conversions: 2}
          - {date: '2024-01-31', platform: 'Google Ads', ad_spend: 8, revenue: 10, impressions: 80, conversions: 3}
          - {date: '2024-02-01', platform: 'Meta Ads', ad_spend: 0, revenue: 0, impressions: 0, conversions: 0}
          - {date: '2024-12-31', platform: 'TikTok Ads', ad_spend: 4, revenue: 12, impressions: 40, conversions: 2}
          - {date: '2023-12-31', platform: 'Google Ads', ad_spend: 100, revenue: 100, impressions: 100, conversions: 100}
          - {date: '2025-01-01', platform: 'Google Ads', ad_spend: 100, revenue: 100, impressions: 100, conversions: 100}
          - {date: '2024-01-01', platform: 'Other', ad_spend: 100, revenue: 100, impressions: 100, conversions: 100}
    expect:
      rows:
        - {Platform: Google, Month: '2024-01-01', AdSpend: 10, Revenue: 20, Impressions: 100, Conversions: 5, RevenuePerDollar: '2.0000000000000000', ImpressionsPerDollar: '10.0000000000000000', ConversionsPerDollar: '0.50000000000000000000'}
        - {Platform: Meta, Month: '2024-02-01', AdSpend: 0, Revenue: 0, Impressions: 0, Conversions: 0, RevenuePerDollar: null, ImpressionsPerDollar: null, ConversionsPerDollar: null}
        - {Platform: TikTok, Month: '2024-12-01', AdSpend: 4, Revenue: 12, Impressions: 40, Conversions: 2, RevenuePerDollar: '3.0000000000000000', ImpressionsPerDollar: '10.0000000000000000', ConversionsPerDollar: '0.50000000000000000000'}
