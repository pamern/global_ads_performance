name: nexora
version: '1.0.0'
config-version: 2
profile: nexora
model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
on-run-start: ["{{ prepare_source_ids() }}"]
models:
