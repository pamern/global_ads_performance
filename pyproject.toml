[project]
name = "global-ad-spend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.10,<2",
    "pandas>=3.0.6",
    "numpy>=2.4,<3",
    "jinja2>=3.1,<4",
    "scipy>=1.18.1",
    "psycopg>=3.3.6",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "sqlalchemy>=2.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
